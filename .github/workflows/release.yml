name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # npm accepts a publish only from this environment (every package's trusted
    # publisher names it), and GitHub lets only main deploy to it - so a
    # release.yml edited on another branch cannot publish.
    environment: npm
    permissions:
      contents: write # push the version commit and tags
      pull-requests: write # open the "Version Packages" PR
      id-token: write # npm provenance / Trusted Publishing (OIDC)
    outputs:
      # "true" while unreleased changesets exist, i.e. the action has just
      # created or updated the "Version Packages" PR instead of publishing.
      has-changesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # changesets/action pushes through the GitHub API (commitMode below),
          # so no git credential needs to sit on disk while dev tooling runs.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      # Node 24 bundles npm 11 — Trusted Publishing needs npm >= 11.5.1, and
      # pnpm 10 delegates `pnpm publish` to the npm CLI.
      - name: Setup Node.js 24.x
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24

      # Storybook is not released and `pnpm build` already skips it; leaving it
      # out keeps its ~120 packages away from the job that holds the npm token.
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --filter '!@mijn-ui/storybook'

      - name: Build Packages
        run: pnpm build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          publish: pnpm run release
          version: pnpm run version
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: without one the action publishes through npm trusted
          # publishing (a short-lived OIDC token per run), and every @mijn-ui
          # package refuses long-lived tokens ("require 2FA, disallow tokens").
          NPM_CONFIG_PROVENANCE: "true"

  # The "Version Packages" PR is pushed with GITHUB_TOKEN, and GitHub starts no
  # workflows for events that token causes - so the PR would never report the
  # checks branch protection requires. workflow_dispatch is the exception to
  # that rule, so start the PR's checks explicitly on the release branch; they
  # report on the branch's head commit, which is the PR's head commit.
  version-pr-checks:
    name: Start checks on the version PR
    needs: release
    if: needs.release.outputs.has-changesets == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write # start workflow_dispatch runs; nothing else
    steps:
      - name: Dispatch Lint, Unit Tests and Security on changeset-release/main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for wf in lint.yml test.yml security.yml; do
            gh workflow run "$wf" --ref changeset-release/main
          done
