name: Unit Tests

on:
  pull_request:
    branches: [main, dev]
  # Started by the Release workflow for the "Version Packages" PR, which gets
  # no pull_request events (see release.yml, version-pr-checks).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 26 is what CI and the release job use. 24 stays because it is still
        # a supported LTS line, and because branch protection requires the
        # "test (24)" check by name: dropping it would block every PR.
        node-version: [24, 26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Run Tests
        run: pnpm test
